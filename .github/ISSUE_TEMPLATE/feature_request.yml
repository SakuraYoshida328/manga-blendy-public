{
  "name": "機能要望",
  "description": "漫画制作で困っている点と必要な動作を教えてください",
  "title": "[Feature] ",
  "body": [
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "どの制作工程で何に困っていますか"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "behavior",
      "attributes": {
        "label": "希望する動作と今の代替方法"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "使用しているMBの版"
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "投稿前の確認",
        "options": [
          {
            "label": "私的資料や認証情報を含めていません",
            "required": true
          }
        ]
      }
    }
  ]
}
