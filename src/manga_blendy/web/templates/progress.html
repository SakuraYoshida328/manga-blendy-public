{% extends 'base.html' %}{% block content %}<p class="eyebrow">BUILDING REFERENCE PACKET</p><h1>{{ manifest.title }}</h1><section class="panel" id="progress" data-project="{{ manifest.project_id }}" data-job="{{ job.job_id }}"><ol class="stages"><li>画像解析</li><li>空間計画</li><li>3D構築</li><li>4視点撮影</li><li>検証</li></ol><h2 id="job-status">{{ job.status }}</h2><p id="elapsed"></p><p id="job-error">{{ job.error.message if job.error else '' }}</p><button id="cancel-job" class="secondary">停止する</button><button id="resume-job" hidden>保存済み段階から再開</button><label id="paid-retry" hidden class="check"><input type="checkbox">未完了のAPI呼出しを再送する（追加課金の可能性を確認）</label><a id="review-link" hidden class="button" href="/projects/{{ manifest.project_id }}/jobs/{{ job.job_id }}/review">結果を確認する</a></section><p>この画面を閉じてもジョブと途中結果を保存します。細かな質問で作業を止めず、解釈は結果画面にまとめます。</p>{% endblock %}
